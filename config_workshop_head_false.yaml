  enable_lunch_break: false
  lunch_break: 12:00-13:00
  enable_holidays_off: false
  enable_half_day_off: false
  enable_morning_shutdown: false
  holidays_off: null
  half_day_off: null
  morning_shutdown: 08:00-12:00
  morning_shutdown_dates: null
  morning_shutdown_schedule: null
  afternoon_shutdown: 15:00-08:00
  afternoon_shutdown_schedule: null
constraints:
  enable_workshop_head_masking: false
  enable_assembly_start_leadtime_layers: false
  enable_assembly_start_window_filter: false
  # [AGENT-EDIT] workshop head masking과 중복되는 runtime workshop-order 제약은 실험 기본값에서 비활성화
  enable_routing_workshop_order: false
  allow_capacity_relaxation: false
  # [AGENT-ADD] start_date 생성 단계에서 용량/달력 제약을 임시 해제할지 여부
  enable_start_date_generation_capacity_override: true
  # [AGENT-ADD] replay 생성 단계에서 용량/달력 제약을 임시 해제할지 여부
  enable_replay_generation_capacity_override: true
  # [AGENT-ADD] assembly 환경이 긴급 블록 때문에 용량 우회를 허용할지 여부
  enable_assembly_urgent_capacity_bypass: true
  # [AGENT-ADD] RL/self-label decoding 경로가 긴급 블록 때문에 용량 우회를 허용할지 여부
  enable_rl_urgent_capacity_bypass: true
