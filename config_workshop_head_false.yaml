  daily_seam_cap_overrides: null
  daily_seam_cap_scales: null
training:
  episodes: 150001
  lr: 0.0001
  epsilon: 0.2
  ppo_iterations: 2
  grad_clip: 1.0
  embedding_dim: 256
  hidden_dim: 256
  n_layers: 1
  n_heads: 4
  dropout: 0.1
  temperature: 1.0
  optimizer: ranger_adabelief
  baseline_update_interval: 10
  statistical_alpha: 0.7
  entropy_coeff: 0.02
  entropy_decay: 0.995
  min_entropy_coeff: 0.0005
  entropy_decay_interval: 50
  initial_entropy_coeff: 0.03
  entropy_warmup_episodes: 50
  train_distribution: eval_like
  num_blocks_min: 50
  num_blocks_max: 90
  max_daily_blocks: 17
  min_spread_days: 5
  use_snu: false
  use_env_state: true
  feature_mode: full
  use_positional_encoding: false
  masking_debug: false
  masking_debug_verbose: false
  fixed_norm_stats: 0
  fixed_norm_warmup_episodes: 5
  mode: self_label
  agent_architecture: single_agent
  self_label_samples: 4
  self_label_mode: 2
  # [AGENT-ADD] legacy_score(기존), primary_first(제약 우선), feasible_first(위반 0 우선), makespan_first
  self_label_selection_strategy: primary_first
  # [AGENT-EDIT] candidate_only(후보군 경쟁만), legacy, warmup_only, disabled
  self_label_lpt_teacher_policy: candidate_only
  # [AGENT-ADD] warmup_only일 때 LPT teacher 허용 에피소드 수
  self_label_lpt_warmup_episodes: 0
  # [AGENT-ADD] teacher LPT만 bias on override 적용 여부 (1/0)
  self_label_lpt_teacher_bias_on: 0
  violation_penalty_weight: 1.0
  longi_balance_weight: 0.1
  start_date_offset: 3
  log_interval: 1
  eval_interval: 100
  save_interval: 100
  violation_print_limit: 0
  seed: 42
